<style>
:root{
  --paper:#f6f1e7; --paper-2:#efe7d6; --ink:#1f1a14; --ink-2:#5b5245; --line:#d9cdb5;
  --accent:#c4552d; --accent-ink:#fff; --ok:#2f7d4f; --card:#fffdf8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16130f; --paper-2:#1e1a15; --ink:#f1e9da; --ink-2:#b4a892; --line:#3a332a;
    --accent:#e0754b; --accent-ink:#1b120c; --ok:#6cc08f; --card:#211c16;
  }
}
:root[data-theme="dark"]{
  --paper:#16130f; --paper-2:#1e1a15; --ink:#f1e9da; --ink-2:#b4a892; --line:#3a332a;
  --accent:#e0754b; --accent-ink:#1b120c; --ok:#6cc08f; --card:#211c16;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font:600 26px/1 Fraunces,serif;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid transparent;color:var(--ink-2);font:500 13px Inter;padding:6px 9px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--line);color:var(--ink);background:var(--card)}
h1,h2{font-family:Fraunces,serif;font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(40px,7vw,76px);line-height:1.02}
h2{font-size:clamp(28px,4vw,40px);line-height:1.1}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:40px 0 72px}
.lede{font-size:19px;color:var(--ink-2);max-width:34ch;margin:22px 0 30px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px 22px;font:600 16px Inter;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:13px;color:var(--ink-2);margin-top:12px}
/* línea de vida animada */
.life{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 22px 10px;box-shadow:0 20px 50px -30px rgba(60,40,10,.35)}
.life svg{width:100%;height:auto;display:block}
.life .path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 5s ease forwards .3s}
.life .dot{fill:var(--paper);stroke:var(--accent);stroke-width:2.5;opacity:0;animation:pop .4s ease forwards}
.life .lbl{fill:var(--ink);font:600 12px Inter;opacity:0;animation:pop .4s ease forwards}
.life .sub{fill:var(--ink-2);font:400 11px Inter;opacity:0;animation:pop .4s ease forwards}
.life .match{fill:var(--ok);opacity:0;animation:pop .4s ease forwards}
.life .mtxt{fill:var(--ok);font:600 11px Inter;opacity:0;animation:pop .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.life *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
section{padding:72px 0;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.step b{display:block;font:600 22px Fraunces,serif;margin:6px 0 8px}
.step .n{font:600 13px Inter;color:var(--accent)}
.step p{margin:0;color:var(--ink-2)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.cmp{border-radius:16px;padding:22px;border:1px solid var(--line)}
.cmp.old{color:var(--ink-2)}
.cmp.new{background:var(--card);border-color:var(--accent)}
.cmp small{display:block;font:600 12px Inter;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cmp p{font:500 20px/1.35 Fraunces,serif;margin:0}
.privacy{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px}
.privacy h3{font:600 17px Inter;margin:0 0 6px}
.privacy p{margin:0;color:var(--ink-2)}
/* formulario */
.join{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:14px}
label{font:500 13px Inter;color:var(--ink-2);display:grid;gap:6px}
input,select{font:16px Inter;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--accent);font-size:14px;min-height:1em;margin:0}
.done{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:none}
.done.show{display:block}
.stats{display:flex;gap:28px;margin:18px 0 22px}
.stats div b{display:block;font:600 34px Fraunces,serif}
.stats div span{font-size:13px;color:var(--ink-2)}
.share{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.reflink{font:500 14px ui-monospace,Menlo,monospace;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;word-break:break-all}
footer{padding:36px 0 48px;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line)}
@media (max-width:820px){
  .hero,.join{grid-template-columns:1fr;gap:32px}
  .steps,.privacy,.compare{grid-template-columns:1fr}
  .wrap{padding:0 16px}
}
</style>

function apply(l){
  lang = l; store.set("bio_lang", l);
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { const v = T[l][el.dataset.i]; if (v!=null) el.textContent = v; });

    fetch(SUPABASE_URL + "/rest/v1/rpc/track_event", {
      method: "POST", keepalive: true,
      headers: { "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_event: ev, p_lang: lang, p_utm: qs.get("utm_source"), p_via_ref: !!qs.get("ref") })
    }).catch(() => {});
  } catch (_) {}
}
track("visita");
document.getElementById("wa").addEventListener("click", () => track("clic_compartir_whatsapp"));
document.getElementById("copy").addEventListener("click", () => track("clic_copiar_enlace"));

async function join(data){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {           // modo demo
    await new Promise(r => setTimeout(r, 400));
    return { code: "demo" + Math.random().toString(36).slice(2,6), position: 128, referrals: 0, cohort: 3 };
  }
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/join_waitlist", {
    method: "POST",
    headers: { "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, t = T[lang], err = document.getElementById("err");
  const v = Object.fromEntries(new FormData(f));
  err.textContent = "";
  if (!v.name.trim() || !v.email.trim() || !v.school.trim() || !v.grad_year) return err.textContent = t.e_req;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return err.textContent = t.e_mail;
  const y = +v.grad_year; if (y < 1950 || y > 2035) return err.textContent = t.e_year;
  const btn = f.querySelector("button"); btn.disabled = true;
  try {
    const res = await join({ p_email: v.email, p_name: v.name, p_country: v.country, p_school: v.school,
      p_grad_year: y, p_lang: lang, p_ref: store.get("bio_ref"), p_utm: qs.get("utm_source"), p_hp: v.website || null });
    const link = location.origin + location.pathname + "?ref=" + res.code + "&lang=" + lang;
    document.getElementById("pos").textContent = "#" + res.position;
    document.getElementById("coh").textContent = res.cohort;
    document.getElementById("refs").textContent = res.referrals;
    document.getElementById("link").textContent = link;
    document.getElementById("wa").href = "https://wa.me/?text=" + encodeURIComponent(t.wa_msg + " " + link);
    document.getElementById("copy").onclick = async e => {
      try { await navigator.clipboard.writeText(link); e.target.textContent = t.copied; } catch(_) {}
    };
    f.style.display = "none"; document.getElementById("done").classList.add("show");
  } catch (e) { err.textContent = t.e_net; btn.disabled = false; }
});
