<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bio · Prototipo del onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4eee2;--card:#fffdf8;--soft:#ebe2d0;--line:#d9cdb5;--ink:#221b13;--ink2:#4a4134;--muted:#6a5f4f;--accent:#c4552d;--accent-ink:#a8431f;--sel:#f7ece5;--ok-bg:#e6f0e8;--ok:#1f4d33;
--display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e1d1;color:var(--ink);font:16px/1.5 var(--body)}
.frame{max-width:420px;min-height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;padding:12px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
@media (min-width:600px){body{padding:24px 0}.frame{min-height:844px;border-radius:28px;box-shadow:0 30px 60px -30px rgba(60,40,10,.45)}}
.proto{align-self:center;font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:10px;margin-bottom:6px}
h1{font:600 28px/1.15 var(--display);margin:0;text-wrap:balance}
h1.big{font-size:34px}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.ink2{color:var(--ink2)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.bar{height:6px;border-radius:3px;background:#e2d8c4;margin:6px 0 14px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent);transition:width .3s}
.screen{flex-grow:1;display:flex;flex-direction:column;gap:14px}
.center{justify-content:center}
button,a.btn,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.icon{width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.link{min-height:44px;min-width:44px;border:0;background:transparent;color:var(--accent-ink);font-weight:600}
.primary,.secondary{min-height:52px;border-radius:14px;width:100%;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.primary{border:0;background:var(--accent);color:#fff}
.secondary{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);position:relative}
input.t,select.t{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;width:100%}
.row{display:flex;gap:10px}.row>*{flex:1 1 0;min-width:0}.row>.w2{flex:2 1 0}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{flex:1 1 0;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--ink);font-weight:500;font-size:14px}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 3px rgba(60,40,10,.18)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.vis{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.note{display:flex;gap:12px;align-items:flex-start}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:16px}
.avatars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.avatars button{min-height:96px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.avatars button[aria-checked=true]{border:3px solid var(--accent-ink)}
.results{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results button{min-height:52px;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:6px 14px;display:flex;flex-direction:column;justify-content:center}
.results button:last-child{border-bottom:0}
.results button[aria-selected=true]{background:var(--sel)}
.results small{font-size:12px;color:var(--muted)}
.opt{min-height:52px;width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;border:0;background:transparent;text-align:left;color:var(--ink)}
.opt[aria-checked=true]{background:var(--sel)}
.radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.opt[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--accent-ink)}
.opt span.l{display:flex;flex-direction:column;flex-grow:1}
.opt small{font-size:12px;color:var(--muted);line-height:1.4}
.el{min-height:60px;width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--ink)}
.el[aria-pressed=true]{border:2px solid var(--accent-ink)}
.el span.l{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.el small{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:3px 8px;border-radius:10px;white-space:nowrap}
.book{background:var(--card);border:1px solid var(--line);border-radius:6px 16px 16px 6px;box-shadow:inset 8px 0 0 var(--soft);padding:26px 20px 26px 28px;display:flex;flex-direction:column;gap:14px}
.serif{font-family:var(--display)}
ol.toc{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px}
ol.toc li{border-bottom:1px solid var(--soft)}ol.toc li:last-child{border-bottom:0}
ol.toc button{min-height:60px;width:100%;display:flex;align-items:center;gap:14px;padding:8px 16px;border:0;background:transparent;text-align:left;color:var(--ink)}
ol.toc .n{font:20px var(--display);color:var(--accent-ink);width:26px}
ol.toc .l{flex-grow:1;display:flex;flex-direction:column}
ol.toc small{font-size:13px;color:var(--muted)}
.ppl{font-size:13px;color:#276b43;white-space:nowrap}
.dots{display:flex}.dots i{width:30px;height:30px;border-radius:15px;border:2px solid var(--ok-bg);margin-left:-10px}.dots i:first-child{margin-left:0}
.mile{display:flex;gap:12px}.mile i{width:10px;height:10px;border-radius:5px;background:var(--accent);margin-top:7px;flex:none}
blockquote{margin:0;font:italic 16px/1.55 var(--display)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main class="frame" id="app" aria-live="polite"></main>
<script>

      var n = school ? Math.max(3, Math.round(S.school.inBio * 0.3)) : 0, hasK = !S.skippedKind && (S.uniName || S.company);
      var html = '<div class="screen"><h1>' + t("m_title") + "</h1>";
      if (school) html += '<div class="ok" style="display:flex;flex-direction:column;gap:10px"><div class="dots" aria-hidden="true"><i style="background:#9cc7ab"></i><i style="background:#b7d6c1"></i><i style="background:#cfe3d6"></i></div><b style="font-size:18px">' + t("m_main", { n: n, cls: esc(cls.trim()) }) + '</b><span style="font-size:14px">' + t("m_sub", { school: esc(S.school.name), years: esc(S.schoolYears) }) + "</span></div>";
      if (hasK) html += '<div class="card"><b>' + t("m_uni", { n: 5, kind: S.kind === "uni" ? "carrera y sección" : "equipo y sede" }) + "</b></div>";
      if (!school && !hasK) html += '<div class="card"><p>' + t("m_none") + "</p></div>";
      return html + '<span class="muted">' + t("m_ex") + "</span></div>"; },
    function () { var sc = S.school ? S.school.name : "colegio";
      return '<div class="screen"><h1>' + t("i_title") + '</h1><p class="ink2">' + t("i_text") + '</p><div class="card">' + esc(t("i_msg", { school: sc })) + '</div><div class="actions"><button class="primary" data-act="wa">' + t("wa") + '</button><button class="secondary" data-act="copy">' + t("copy") + "</button></div></div>"; },
    function () { var parts = [S.birthCity || "Nacimiento"]; if (S.school && !S.skippedSchool) parts.push(S.school.name); if (!S.skippedKind && (S.uniName || S.company)) parts.push(S.uniName || S.company); if (S.city) parts.push(S.city);
      var sec = Math.round((Date.now() - S.startedAt) / 1000), tm = Math.floor(sec / 60) + " min " + (sec % 60) + " s";
      return '<div class="screen center"><h1 class="big">' + t("e_title") + '</h1><div style="display:flex;justify-content:center">' + avatarSvg(AVATARS[S.av], 110) + '</div><p class="ink2">' + t("e_text", { path: esc(parts.join(" → ")), n: parts.length, t: tm }) + '</p><div class="actions"><button class="primary" data-act="book">' + t("asBook") + '</button><button class="secondary" data-act="video">' + IC.play + t("asVideo") + '</button><button class="link" data-act="vis">' + t("edit") + "</button></div></div>"; }
  ];

  function renderOb() {
    var n = S.step;
    if (n > 0 && !sentSteps[n]) { sentSteps[n] = 1; track("proto_paso_" + (n + 1)); }
    var head = '<span class="proto">' + t("proto") + '</span><div class="top">' + (n > 0 ? '<button class="icon" data-act="back" aria-label="' + t("back") + '">' + IC.back + "</button>" : '<span style="width:44px"></span>') +
      '<span class="muted" style="font-size:13px">' + t("step", { n: n + 1, s: SECS[n] }) + "</span>" + (SKIPPABLE.indexOf(n) >= 0 ? '<button class="link" data-act="skip">' + t("skip") + "</button>" : '<span style="width:44px"></span>') + "</div>" +
      '<div class="bar" role="progressbar" aria-label="Progreso" aria-valuemin="1" aria-valuemax="9" aria-valuenow="' + (n + 1) + '"><i style="width:' + Math.round((n + 1) / 9 * 100) + '%"></i></div>';
    var foot = n < 8 ? '<div class="actions"><button class="primary" data-act="next">' + (n === 0 ? t("start") : n === 7 ? t("later") : t("next")) + "</button></div>" : "";
    app.innerHTML = head + STEPS[n]() + foot;
  }

  /* ---------- visibilidad por elemento ---------- */
  var LV = [["yo", "Solo yo", "Nadie más, ni Bio puede leerlo"], ["otra", "Solo la otra persona", "Luis R., si confirma el vínculo"], ["grupo", "Un grupo que elijo", "Amigas del liceo · 5 personas"], ["amigos", "Amigos", "Tus amigos en Bio"], ["seguidores", "Seguidores", "Amigos y quien te sigue"], ["publico", "Público", "Cualquier persona"]];
  var EL = [["fecha", "Fecha", "2003"], ["lugar", "Lugar", "Caracas"], ["persona", "Persona", "Luis R."], ["texto", "Texto del recuerdo", "«Fue en la fiesta de fin de curso…»"]];
  function lvName(k) { for (var i = 0; i < LV.length; i++) if (LV[i][0] === k) return LV[i][1]; }
  function renderVis() {
    var sees = { amigo: ["publico", "seguidores", "amigos"], otra: ["publico", "otra"], cualquiera: ["publico"] }[S.tab];
    function v(k) { return sees.indexOf(S.vis[k]) >= 0; }
    var shown = EL.filter(function (e) { return v(e[0]); }).length, meta = [v("fecha") ? "2003" : "", v("lugar") ? "Caracas" : ""].filter(Boolean).join(" · ");
    var selLabel = EL.filter(function (e) { return e[0] === S.sel; })[0][1].toLowerCase();
    var pv = shown ? '<b class="serif" style="font-size:20px">' + t("v_title") + "</b>" + (meta ? '<span class="muted">' + meta + "</span>" : "") + (v("persona") ? "<span>Con <b>Luis R.</b></span>" : "") + (v("texto") ? "<blockquote>«Fue en la fiesta de fin de curso, en la terraza del liceo, mientras sonaba la última canción.»</blockquote>" : "") + (shown < 4 ? '<span class="muted">' + t("v_hidden", { n: 4 - shown }) + "</span>" : "")
      : '<span class="muted">' + (S.trace === "ocultar" ? t("v_none_h") : t("v_none_l")) + "</span>";
    app.innerHTML = '<span class="proto">' + t("proto") + '</span><div class="top"><button class="icon" data-act="tob" aria-label="' + t("back") + '">' + IC.back + '</button><b style="font-size:15px">' + t("who") + '</b><span style="width:44px"></span></div><div class="screen">' +
      '<div class="card"><span class="muted" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase">' + t("v_kind") + "</span><h1>" + t("v_title") + '</h1><p class="muted">' + t("v_text") + "</p></div>" +
      '<div style="display:flex;flex-direction:column;gap:8px">' + EL.map(function (e) { return '<button class="el" data-act="sel" data-k="' + e[0] + '" aria-pressed="' + (S.sel === e[0]) + '"><span class="l"><small>' + e[1] + "</small><span>" + esc(e[2]) + '</span></span><b style="font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center">' + (S.vis[e[0]] === "yo" ? IC.lock : "") + lvName(S.vis[e[0]]) + "</b></button>"; }).join("") + "</div>" +
      '<div class="card" style="padding:12px"><p class="muted" style="padding:0 4px 6px">' + t("v_who", { x: "<b style=\"color:var(--ink)\">" + selLabel + "</b>" }) + '</p><div role="radiogroup">' + LV.map(function (l) { return '<button class="opt" role="radio" data-act="lv" data-k="' + l[0] + '" aria-checked="' + (S.vis[S.sel] === l[0]) + '"><span class="radio"></span><span class="l"><span>' + l[1] + "</span><small>" + l[2] + "</small></span>" + (l[0] === "yo" ? '<span class="badge">Cifrado E2E</span>' : "") + "</button>"; }).join("") + "</div></div>" +
      '<div class="card" style="padding:12px"><p class="muted" style="padding:0 4px 6px">' + t("v_trace") + '</p><div role="radiogroup">' + [["ocultar", "Ocultar por completo (por defecto)", "No verá ningún rastro: ni el hito, ni un candado, ni un hueco en tu índice."], ["candado", "Mostrar con candado", "Verá que hay algo privado, sin título, fecha ni lugar."]].map(function (o) { return '<button class="opt" role="radio" data-act="trace" data-k="' + o[0] + '" aria-checked="' + (S.trace === o[0]) + '"><span class="radio"></span><span class="l"><span>' + o[1] + "</span><small>" + o[2] + "</small></span></button>"; }).join("") + "</div></div>" +
      "<b>" + t("preview") + '</b><div class="seg" role="tablist">' + [["amigo", "Un amigo"], ["otra", "Luis R."], ["cualquiera", "Cualquiera"]].map(function (x) { return '<button role="tab" data-act="tab" data-k="' + x[0] + '" aria-selected="' + (S.tab === x[0]) + '">' + x[1] + "</button>"; }).join("") + '</div><div class="card" style="min-height:140px;display:flex;flex-direction:column;gap:8px">' + pv + "</div>" +
      '<div class="ok note"><div style="display:flex;flex-direction:column;gap:4px"><b>' + t("v_link_t") + '</b><span style="font-size:13px">' + t("v_link") + "</span></div></div>" +
      '<div class="actions"><button class="primary" data-act="savevis">' + t("save") + "</button></div></div>";
  }

  /* ---------- libro ---------- */
  var CH = [["Infancia en Caracas", "1988–1994", "", false], ["Colegio", "1994–2000", "18 personas", false], ["Liceo", "2000–2005", "24 personas", false], ["Universidad", "2005–2010", "42 personas", false], ["Primer trabajo", "2010–2014", "", true], ["Emigrar", "2014", "6 personas", false], ["Madrid", "2014–2021", "", false], ["Hoy", "2021–hoy", "", false]];
  function renderBook(page) {
    var head = '<span class="proto">' + t("proto") + "</span>";
    if (page === "cover") {
      app.innerHTML = head + '<div class="top"><button class="icon" data-act="toend" aria-label="' + t("back") + '">' + IC.back + '</button><span></span><span style="width:44px"></span></div><div class="screen"><div class="book" style="flex-grow:1;align-items:center;justify-content:center;text-align:center"><span class="muted" style="font-size:12px;letter-spacing:.14em;text-transform:uppercase">' + t("bk_sub") + "</span>" + avatarSvg(AVATARS[S.av], 140) + '<h1 class="big">La historia de Andrea</h1><p class="serif muted" style="font-size:18px">1988 — hoy</p></div><div class="actions"><button class="primary" data-act="toc">' + t("bk_open") + '</button><div class="row"><button class="secondary" data-act="video">' + IC.play + t("asVideo") + '</button><button class="secondary" data-act="print" style="border-style:dashed;color:var(--muted)">' + t("bk_print") + "</button></div></div></div>";
    } else if (page === "toc") {
      app.innerHTML = head + '<div class="top"><button class="icon" data-act="book" aria-label="' + t("back") + '">' + IC.back + '</button><b style="font-size:15px">La historia de Andrea</b><span style="width:44px"></span></div><div class="screen"><h1>' + t("toc") + '</h1><p class="muted">' + t("toc_text") + '</p><ol class="toc">' + CH.map(function (c, i) { return c[3] ? "" : '<li><button data-act="chapter" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="l"><b>' + c[0] + "</b><small>" + c[1] + "</small></span>" + (c[2] ? '<span class="ppl">' + c[2] + "</span>" : "") + "</button></li>"; }).join("") + '</ol><p class="muted" style="font-size:13px">En el libro real, un capítulo privado se oculta o aparece con candado según elija su autor.</p></div>';
    } else {
      app.innerHTML = head + '<div class="top"><button class="icon" data-act="toc" aria-label="' + t("prev") + '">' + IC.back + '</button><span class="muted" style="font-size:13px">' + t("ch", { n: 2 }) + ' de 8</span><span style="width:44px"></span></div><div class="screen"><article class="book"><span class="muted" style="font-size:12px;letter-spacing:.14em;text-transform:uppercase">' + t("ch", { n: 2 }) + ' · 1994–2000</span><h1>Colegio</h1><p class="serif" style="font-size:17px;line-height:1.6">En septiembre de 1994 Andrea entró por primera vez en el Colegio San José, en Caracas, con una mochila más grande que ella. Seis cursos después salió de 6º B con amigas para toda la vida.</p>' +
        [["Primer día de colegio", "Sep 1994 · Colegio San José, Caracas"], ["Excursión de la clase a la Colonia Tovar", "May 1997 · Colonia Tovar"], ["Graduación de 6º grado, sección B", "Jul 2000 · Caracas"]].map(function (m) { return '<div class="mile"><i></i><div><b>' + m[0] + '</b><br><span class="muted">' + m[1] + "</span></div></div>"; }).join("") +
        '<div class="ok"><b>12 compañeros de tu aula 6º B</b><br><span style="font-size:13px">Coincidieron contigo entre 1999 y 2000</span></div><div class="card" style="background:#f7f1e6;border:0"><span class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em">' + t("diary") + " · 12 jun 2000</span><blockquote>«Último día de clase. La maestra Carmen nos hizo escribir una carta para abrir dentro de diez años. Yo puse que quería vivir en otro país.»</blockquote></div></article>" +
        '<div class="actions"><button class="secondary" data-act="toc">' + t("prev") + '</button><button class="link" data-act="restart">' + t("restart") + "</button></div></div>";
    }
  }

  function render() {
    if (S.view === "ob") renderOb(); else if (S.view === "vis") renderVis(); else renderBook(S.view);
    var h = app.querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); }
  }
  function focusTitle() { var h = app.querySelector("h1"); if (h) h.focus({ preventScroll: false }); window.scrollTo(0, 0); }

  /* ---------- eventos ---------- */
  var MAP = ["birthCity", "birthDate", "schoolQ", "section", "schoolYears", "uniName", "career", "uniSection", "company", "site", "team", "kindYears", "city", "since"];
  app.addEventListener("input", function (e) {
    var id = e.target.id; if (MAP.indexOf(id) < 0) return;
    S[id] = e.target.value;
    if (id === "schoolQ") { S.school = null; var pos = e.target.selectionStart; render(); var el = document.getElementById("schoolQ"); el.focus(); el.setSelectionRange(pos, pos); }
  });
  app.addEventListener("change", function (e) { if (e.target.id === "course") S.course = e.target.value; });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, go = function (n) { S.step = n; render(); focusTitle(); };
    switch (a) {
      case "next":
        if (S.step === 0) { S.startedAt = Date.now(); track("proto_inicio"); }
        if (S.step === 2 && (!S.birthCity.trim() || !S.birthDate.trim())) { var er = document.getElementById("berr"); er.textContent = t("b_err"); er.style.color = "var(--accent-ink)"; document.getElementById(S.birthCity.trim() ? "birthDate" : "birthCity").focus(); return; }
        if (S.step === 3) S.skippedSchool = !S.school;
        if (S.step === 4) S.skippedKind = false;
        go(S.step + 1); if (S.step === 8) track("proto_fin"); break;
      case "skip": if (S.step === 3) S.skippedSchool = true; if (S.step === 4) S.skippedKind = true; go(S.step + 1); if (S.step === 8) track("proto_fin"); break;
      case "back": go(S.step - 1); break;
      case "av": S.av = +b.dataset.i; render(); app.querySelector('[data-act=av][data-i="' + S.av + '"]').focus(); break;
      case "prec": S.prec = b.dataset.v; render(); break;
      case "school": S.school = SCHOOLS.filter(function (s) { return s.name === b.dataset.n; })[0]; S.schoolQ = S.school.name; render(); break;
      case "kind": S.kind = b.dataset.v; render(); break;
      case "wa": toast(t("sent")); break;
      case "copy": try { navigator.clipboard.writeText("https://bio.app/i/demo").catch(function () {}); } catch (x) {} toast(t("copied")); break;
      case "vis": S.view = "vis"; render(); focusTitle(); break;
      case "tob": S.view = S.step === 8 ? "ob" : "ob"; render(); focusTitle(); break;
      case "sel": S.sel = b.dataset.k; render(); break;
      case "lv": S.vis[S.sel] = b.dataset.k; render(); break;
      case "trace": S.trace = b.dataset.k; render(); break;
      case "tab": S.tab = b.dataset.k; render(); break;
      case "savevis": toast(t("saved")); break;
      case "book": S.view = "cover"; render(); focusTitle(); break;
      case "toc": S.view = "toc"; render(); focusTitle(); break;
      case "chapter": S.view = "chapter"; render(); focusTitle(); break;
      case "toend": S.view = "ob"; S.step = 8; render(); focusTitle(); break;
      case "video": toast(t("videoSoon")); break;
      case "print": toast("Función premium (simulada)"); break;
      case "restart": location.reload(); break;
    }
  });
  render();
})();
</script>
