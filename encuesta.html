<style>
:root{
  --paper:#f6f1e7; --paper-2:#efe7d6; --ink:#1f1a14; --ink-2:#5b5245; --line:#d9cdb5;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16130f; --paper-2:#1e1a15; --ink:#f1e9da; --ink-2:#b4a892; --line:#3a332a;
    --accent:#e0754b; --accent-ink:#1b120c; --ok:#6cc08f; --card:#211c16;
  }
}
:root[data-theme="dark"]{
  --paper:#16130f; --paper-2:#1e1a15; --ink:#f1e9da; --ink-2:#b4a892; --line:#3a332a;
  --accent:#e0754b; --accent-ink:#1b120c; --ok:#6cc08f; --card:#211c16;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font:600 26px/1 Fraunces,serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid transparent;color:var(--ink-2);font:500 13px Inter,system-ui;padding:8px 10px;border-radius:999px;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{border-color:var(--line);color:var(--ink);background:var(--card)}
.progress{height:6px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.ptext{font-size:13px;color:var(--ink-2);min-height:1.4em;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 20px 50px -34px rgba(60,40,10,.35)}
h1,h2{font-family:Fraunces,serif;font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(30px,7vw,42px);line-height:1.08;margin-bottom:14px}
h2{font-size:clamp(22px,5vw,28px);line-height:1.2}
h1:focus,h2:focus{outline:none}
.kicker{font:600 12px Inter,system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px}
.hint{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.lede{color:var(--ink-2);margin:0 0 16px}
fieldset{border:0;margin:0 0 6px;padding:0;min-width:0}
fieldset+fieldset{margin-top:22px}
legend{padding:0;margin-bottom:14px;width:100%}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--ink-2)}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--card);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{flex-direction:column;justify-content:center;gap:4px;padding:10px 4px;font-weight:600}
.scale-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2);margin-top:8px}
.scale-l span:last-child{text-align:right}
label.f{font:500 14px Inter,system-ui;color:var(--ink-2);display:grid;gap:6px;margin-top:12px}
input[type=email],input[type=text],select,textarea{font:16px Inter,system-ui;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:130px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:var(--ink-2);text-align:right}
.priv{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink-2);margin:0 0 16px}
.priv strong{color:var(--ink)}
.priv ul{margin:8px 0 6px;padding-left:18px}
.priv li{margin:3px 0}
a{color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;padding:6px 0}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 22px;min-height:48px;font:600 16px Inter,system-ui;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nav .btn:last-child{margin-left:auto}
.err{color:var(--accent);font-size:14px;min-height:1.2em;margin:12px 0 0;font-weight:500}
.demo{font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.stack{display:grid;gap:10px;margin-top:18px}
.note{font-size:13px;color:var(--ink-2);margin-top:12px}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
footer{padding:28px 0 40px;color:var(--ink-2);font-size:13px}
@media (min-width:560px){.card{padding:30px 32px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>

</div>

/* ---------- Estado (localStorage solo para no perder el progreso; nunca el email) ---------- */
const qs = new URLSearchParams(location.search);
const UTM = (qs.get("utm_source") || qs.get("src") || "").slice(0, 60);
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({ v:1, lang, step, consent, answers, order })); } catch (e) {} }
function clearStore(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
function bioLang(){ try { return localStorage.getItem("bio_lang"); } catch (e) { return null; } }

const saved = load();
let answers = (saved && saved.answers) || {};
let consent = !!(saved && saved.consent);
let step = (saved && consent && typeof saved.step === "number" && saved.step > 0 && saved.step < SCREENS.indexOf("thanks")) ? saved.step : 0;
let lang = qs.get("lang") || (saved && saved.lang) || bioLang() || (navigator.language || "es").slice(0, 2);
if (!T[lang]) lang = "es";
let order = (saved && saved.order) || {};
for (const id of ["q5", "q14"]) {               // aleatoriza opciones una vez; «Otro»/«No la compartiría» al final
  const q = Q[id], movable = q.o.filter(x => !q.fixed.includes(x));
  if (!Array.isArray(order[id]) || order[id].length !== q.o.length) {
    for (let i = movable.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [movable[i], movable[j]] = [movable[j], movable[i]]; }
    order[id] = movable.concat(q.fixed);
  }
}
let emailDraft = "", emailOk = false;

/* ---------- Medición agregada (sin cookies ni identificadores) ---------- */
function track(ev){
  if (DEMO) return;
  try {
    fetch(SUPABASE_URL + "/rest/v1/rpc/track_event", {
      method: "POST", keepalive: true,
      headers: { "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_event: ev, p_lang: lang, p_utm: UTM || null, p_via_ref: false })
    }).catch(() => {});
  } catch (_) {}
}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const isShown = id => !Q[id].show || Q[id].show(answers);
const screenShown = i => { const s = SCREENS[i]; return Array.isArray(s) ? s.some(isShown) : true; };
const qScreens = () => SCREENS.map((s, i) => i).filter(i => Array.isArray(SCREENS[i]) && screenShown(i));
function optionCodes(id){
  const q = Q[id];
  if (q.o === "countries") { const l = COUNTRY_LISTS[lang].slice(); if (answers[id] && !l.includes(answers[id])) l.splice(l.length - 1, 0, answers[id]); return l; }
  return order[id] || q.o;
}
function waitlistUrl(){
  const p = new URLSearchParams({ utm_source: UTM || "encuesta", lang });
  return "index.html?" + p.toString() + "#join";
}
function surveyUrl(){
  const p = new URLSearchParams({ lang }); if (UTM) p.set("utm_source", UTM);
  return location.origin + location.pathname + "?" + p.toString();
}

/* ---------- Render ---------- */
function renderQuestion(id, solo){
  const t = T[lang], q = Q[id], tx = t.q[id], name = "f_" + id;
  const req = q.req ? "" : ` <span class="hint" style="display:inline">${esc(t.opt)}</span>`;
  const tag = solo ? "h2" : "h2";
  let hint = "";
  if (q.type === "multi") hint = `<p class="hint">${esc(t.multi)}</p>`;
  if (q.type === "short" && tx[1]) hint = `<p class="hint">${esc(tx[1])}</p>`;
  if (id === "q24" && tx[2]) hint = `<p class="hint">${esc(tx[2])}</p>`;
  const legendId = "lg_" + id;
  let body = "";
  if (q.type === "one" || q.type === "multi") {
    const typ = q.type === "one" ? "radio" : "checkbox", cur = answers[id];
    body = `<div class="opts">` + optionCodes(id).map(c => {
      const on = q.type === "one" ? cur === c : Array.isArray(cur) && cur.includes(c);
      return `<label class="opt"><input type="${typ}" name="${name}" value="${esc(c)}"${on ? " checked" : ""}><span>${esc(tx[1][c])}</span></label>`;
    }).join("") + `</div>`;
  } else if (q.type === "scale") {
    const lo = tx[1] || t.s_lo, hi = tx[2] || t.s_hi;
    body = `<div class="scale">` + [1,2,3,4,5].map(n =>
      `<label class="opt"><input type="radio" name="${name}" value="${n}"${answers[id] === n ? " checked" : ""} aria-label="${n}${n===1 ? " — " + esc(lo) : n===5 ? " — " + esc(hi) : ""}"><span aria-hidden="true">${n}</span></label>`).join("") +
      `</div><div class="scale-l" aria-hidden="true"><span>${esc(lo)}</span><span>${esc(hi)}</span></div>`;
  } else if (q.type === "select") {
    body = `<label class="f"><span class="sr">${esc(tx[0])}</span><select name="${name}" aria-labelledby="${legendId}"><option value="">${esc(t.choose)}</option>` +
      optionCodes(id).map(c => `<option value="${c}"${answers[id] === c ? " selected" : ""}>${esc(t.countries[c])}</option>`).join("") + `</select></label>`;
  } else {
    const v = esc(answers[id] || ""), len = (answers[id] || "").length;
    const field = q.type === "long"
      ? `<textarea name="${name}" maxlength="${q.max}" aria-labelledby="${legendId}" aria-describedby="cnt_${id}">${v}</textarea>`
      : `<input type="text" name="${name}" maxlength="${q.max}" value="${v}" aria-labelledby="${legendId}" aria-describedby="cnt_${id}">`;
    body = `<label class="f">${field}</label><div class="count" id="cnt_${id}">${fmt(t.chars, { n: len, m: q.max })}</div>`;
  }
  return `<fieldset data-q="${id}"><legend><${tag} id="${legendId}" tabindex="-1">${esc(tx[0])}${req}</${tag}>${hint}</legend>${body}</fieldset>`;
}

function render(){
  const t = T[lang], s = SCREENS[step], f = $("#screen");
  document.documentElement.lang = lang;
  document.title = "Bio — " + t.title;
  $("#foot").textContent = t.foot;
  $("#home").setAttribute("href", "index.html?lang=" + lang);
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("#demo").hidden = !DEMO; $("#demo").textContent = t.demo;

  // Progreso
  const list = qScreens(), pos = list.indexOf(step);
  const inQ = Array.isArray(s);
  $("#bar").hidden = !(inQ || s === "close");
  const pct = s === "close" ? 100 : inQ ? Math.round(100 * pos / list.length) : 0;
  $("#pfill").style.width = pct + "%";
  $("#pbar").setAttribute("aria-valuenow", pct);
  $("#pbar").setAttribute("aria-label", t.title);
  $("#ptext").textContent = inQ ? fmt(t.prog, { n: pos + 1, t: list.length }) : "";

  let h = "";
  if (s === "intro") {
    h = `<h1 tabindex="-1">${esc(t.i_t)}</h1><p class="lede">${esc(t.i_l)}</p>
      <div class="priv">${t.i_p}<a href="privacy.html?lang=${lang}#encuesta-${lang}" target="_blank" rel="noopener">${esc(t.i_link)}</a></div>
      <label class="check"><input type="checkbox" id="consent"${consent ? " checked" : ""}><span>${esc(t.i_c)}</span></label>
      <p class="err" id="err" role="alert"></p>
      <div class="nav"><button class="btn" type="submit">${esc(t.start)}</button></div>`;
  } else if (inQ) {
    const ids = s.filter(isShown);
    h = `<p class="kicker">${esc(t.blocks[Q[ids[0]].b])}</p>` + ids.map(id => renderQuestion(id, ids.length === 1)).join("") +
      `<p class="err" id="err" role="alert"></p>
      <div class="nav"><button class="btn ghost" type="button" id="back">${esc(t.back)}</button><button class="btn" type="submit">${esc(t.next)}</button></div>`;
  } else if (s === "close") {
    h = `<h2 tabindex="-1">${esc(t.c_t)}</h2><p class="lede" style="margin-top:10px">${esc(t.c_l)}</p>
      <label class="f"><span>${esc(t.c_email)}</span><input type="email" id="email" maxlength="254" autocomplete="email" inputmode="email" value="${esc(emailDraft)}"></label>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="emailc"${emailOk ? " checked" : ""}><span>${esc(t.c_c)}</span></label>
      <div class="hp" aria-hidden="true"><label>Website <input name="website" id="website" type="text" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="err" role="alert"></p>
      <div class="nav"><button class="btn ghost" type="button" id="back">${esc(t.back)}</button><button class="btn" type="submit" id="send">${esc(t.send)}</button></div>`;
  } else if (s === "thanks") {
    h = `<h2 tabindex="-1">${esc(t.g_t)}</h2><p class="lede" style="margin-top:10px">${esc(t.g_l)}</p>
      <div class="stack"><a class="btn" id="towait" href="${esc(waitlistUrl())}">${esc(t.g_btn)}</a></div>
      <p class="note">${esc(t.g_share)}</p>
      <div class="stack"><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t.wa_msg + " " + surveyUrl())}">${esc(t.g_wa)}</a></div>`;
  } else if (s === "minor") {
    h = `<h2 tabindex="-1">${esc(t.m_t)}</h2><p class="lede" style="margin-top:10px">${esc(t.m_l)}</p>
      <div class="stack"><a class="btn ghost" href="index.html?lang=${lang}">${esc(t.m_btn)}</a></div>`;
  }
  f.innerHTML = h;
  bind();
}

function focusTop(){ const el = $("#screen h1, #screen h2"); if (el) el.focus({ preventScroll: true }); window.scrollTo(0, 0); }

/* ---------- Interacción ---------- */
function bind(){
  const f = $("#screen");
  f.querySelectorAll("fieldset[data-q]").forEach(fs => {
    const id = fs.dataset.q, q = Q[id];
    fs.addEventListener("input", e => {
      const el = e.target;
      if (q.type === "one") answers[id] = el.value;
      else if (q.type === "scale") answers[id] = +el.value;
      else if (q.type === "select") { if (el.value) answers[id] = el.value; else delete answers[id]; }
      else if (q.type === "multi") {
        if (q.excl && el.checked) {             // «No la compartiría» excluye a las demás
          fs.querySelectorAll("input").forEach(i => { if (el.value === q.excl ? i !== el : i.value === q.excl) i.checked = false; });
        }
        const v = [...fs.querySelectorAll("input:checked")].map(i => i.value);
        if (v.length) answers[id] = v; else delete answers[id];
      } else {
        const v = el.value.slice(0, q.max);
        if (v.trim()) answers[id] = v; else delete answers[id];
        const c = $("#cnt_" + id); if (c) c.textContent = fmt(T[lang].chars, { n: el.value.length, m: q.max });
      }
      $("#err").textContent = "";
      save();
    });
  });
  const back = $("#back"); if (back) back.onclick = () => go(-1);
  const em = $("#email"); if (em) em.oninput = () => { emailDraft = em.value; };
  const ec = $("#emailc"); if (ec) ec.onchange = () => { emailOk = ec.checked; };
  const cs = $("#consent"); if (cs) cs.onchange = () => { consent = cs.checked; $("#err").textContent = ""; save(); };
}

function prune(){                               // borra respuestas de preguntas ocultas por la lógica condicional
  for (const id in answers) if (!Q[id] || !isShown(id)) delete answers[id];
}

function go(dir){
  let i = step + dir;
  while (i > 0 && i < SCREENS.length && Array.isArray(SCREENS[i]) && !screenShown(i)) i += dir;
  if (i < 0) i = 0;
  step = i; save(); render(); focusTop();
}

function payload(){
  prune();
  const a = {};
  for (const id of Object.keys(Q)) if (answers[id] !== undefined && isShown(id)) a[id] = answers[id];
  return a;
}

async function submitSurvey(body){
  if (DEMO) { await new Promise(r => setTimeout(r, 400)); return { ok: true }; }
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/submit_survey", {
    method: "POST",
    headers: { "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

$("#screen").addEventListener("submit", async ev => {
  ev.preventDefault();
  const t = T[lang], s = SCREENS[step], err = $("#err");
  if (s === "intro") {
    if (!consent) { err.textContent = t.e_consent; $("#consent").focus(); return; }
    return go(1);
  }
  if (Array.isArray(s)) {
    const missing = s.filter(isShown).find(id => Q[id].req && (answers[id] === undefined || (Array.isArray(answers[id]) && !answers[id].length)));
    if (missing) { err.textContent = t.e_req; const el = $(`fieldset[data-q="${missing}"] input, fieldset[data-q="${missing}"] select`); if (el) el.focus(); return; }
    if (s[0] === "q1" && answers.q1 === "lt18") {   // filtro de edad: fin sin guardar nada
      answers = {}; consent = false; clearStore(); step = SCREENS.indexOf("minor"); render(); focusTop(); return;
    }
    prune();
    return go(1);
  }
  if (s === "close") {
    const email = emailDraft.trim();
    if (email && !emailOk) { err.textContent = t.e_mailc; $("#emailc").focus(); return; }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = t.e_mail; $("#email").focus(); return; }
    const btn = $("#send"); btn.disabled = true; btn.textContent = t.sending;
    try {
      await submitSurvey({
        p_answers: payload(), p_consent: consent, p_lang: lang, p_utm: UTM || null,
        p_email: email && emailOk ? email : null, p_email_consent: !!(email && emailOk),
        p_version: SURVEY_VERSION, p_hp: $("#website").value || null
      });
      track("encuesta_enviada");
      clearStore(); answers = {}; emailDraft = ""; emailOk = false;
      step = SCREENS.indexOf("thanks"); render(); focusTop();
    } catch (e) {
      err.textContent = t.e_net; btn.disabled = false; btn.textContent = t.send;
    }
  }
});

document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { lang = b.dataset.l; save(); render(); });
render();
track("visita_encuesta");
</script>
